<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VU Deadlines</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-row">
        <div class="brand">
          <img class="logo" src="icons/logo.png" width="40" height="40" alt="" />
          <div>
            <h1>VU Deadlines</h1>
            <p class="tagline">Never miss a deadline · by Ar Gorsi</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 13.65-6.65z"/>
            </svg>
          </button>
          <button id="sync-btn" class="sync-btn" type="button">Sync Now</button>
        </div>
      </div>
      <p id="sync-meta" class="sync-meta">
        <span class="dot" aria-hidden="true"></span>
        <span id="sync-meta-text">Checking VULMS…</span>
      </p>
    </header>

    <div id="banner" class="banner" hidden></div>

    <section class="summary" id="summary" aria-label="Deadline summary">
      <div class="stat">
        <span class="stat-icon stat-icon-upcoming" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill-rule="evenodd">
            <path fill="currentColor" d="M19 4h-1V3a1 1 0 1 0-2 0v1H8V3a1 1 0 1 0-2 0v1H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10z"/>
          </svg>
        </span>
        <div class="stat-copy">
          <strong id="count-upcoming">0</strong>
          <span class="stat-label">Upcoming</span>
        </div>
      </div>
      <div class="stat stat-today">
        <span class="stat-icon stat-icon-today" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill-rule="evenodd">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16z"/>
            <path fill="currentColor" d="M11.25 7h1.5v5.15l4.1 2.45-.75 1.25-4.85-2.9z"/>
          </svg>
        </span>
        <div class="stat-copy">
          <strong id="count-today">0</strong>
          <span class="stat-label">Due Today</span>
        </div>
      </div>
      <div class="stat stat-overdue">
        <span class="stat-icon stat-icon-overdue" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill-rule="evenodd">
            <path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
          </svg>
        </span>
        <div class="stat-copy">
          <strong id="count-overdue">0</strong>
          <span class="stat-label">Overdue</span>
        </div>
      </div>
    </section>

    <nav class="filters" aria-label="Activity type">
      <button class="chip is-active" data-filter="all" type="button">All</button>
      <button class="chip" data-filter="assignment" type="button">Assignment</button>
      <button class="chip" data-filter="quiz" type="button">Quiz</button>
      <button class="chip" data-filter="gdb" type="button">GDB</button>
    </nav>

    <div id="course-filter-wrap" class="course-filter-wrap">
      <label for="course-filter">Course</label>
      <select id="course-filter">
        <option value="all">All courses</option>
      </select>
    </div>

    <main id="list" class="list"></main>

    <footer class="footer">
      Unofficial. Your VULMS data stays in this browser.
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
